<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ShogunOS — Live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #bg-layer {
      position: fixed; inset: 0;
      background: #000;
      background-size: cover;
      background-position: center;
      transition: background-color 0.4s ease;
    }
    #bg-overlay { position: fixed; inset: 0; background: transparent; }

    #text-layer {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #text-layer.visible { opacity: 1; transform: translateY(0); }

    #title-el {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 18px; font-weight: 400;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    #lyrics-el {
      font-size: 52px; line-height: 1.65;
      font-weight: 300; letter-spacing: 0.03em;
      color: #fff; text-align: center;
      white-space: pre-line; word-break: break-word;
    }

    #text-box {
      max-width: 100%;
      border: 0px solid transparent;
      border-radius: 0px;
      padding: 0;
      box-sizing: border-box;
      transition: border-color 0.3s ease, border-width 0.3s ease, border-radius 0.3s ease;
    }

    #video-layer {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #video-layer.visible { opacity: 1; }
    #video-el {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    #image-layer {
      position: fixed; inset: 0;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #image-layer.visible { opacity: 1; }

    #blank-layer {
      position: fixed; inset: 0;
      background: #000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #blank-layer.visible { opacity: 1; }

    #timer-layer {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #timer-layer.visible { opacity: 1; pointer-events: auto }
    #timer-label {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 22px; font-weight: 400;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 28px;
      text-align: center;
    }
    #timer-clock {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 168px; font-weight: 200;
      color: #fff; letter-spacing: 0.04em;
      line-height: 1;
    }
    #timer-clock.done { color: #ff2d87; }

    #icon-layer {
      position: fixed;
      display: none;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
  </style>
</head>
<body>
  <div id="bg-layer"></div>
  <div id="bg-overlay"></div>

  <div id="image-layer"></div>

  <div id="video-layer">
    <video id="video-el" playsinline></video>
  </div>

  <div id="text-layer">
    <div id="text-box">
      <div id="title-el"></div>
      <div id="lyrics-el"></div>
    </div>
  </div>

  <div id="icon-layer"></div>

  <div id="blank-layer"></div>

  <div id="timer-layer">
    <div id="timer-label"></div>
    <div id="timer-clock">00:00</div>
  </div>

  <script>
    const bgLayer    = document.getElementById('bg-layer')
    const textLayer  = document.getElementById('text-layer')
    const textBox    = document.getElementById('text-box')
    const titleEl    = document.getElementById('title-el')
    const lyricsEl   = document.getElementById('lyrics-el')
    const videoLayer = document.getElementById('video-layer')
    const videoEl    = document.getElementById('video-el')
    const imageLayer = document.getElementById('image-layer')
    const blankLayer = document.getElementById('blank-layer')
    const timerLayer = document.getElementById('timer-layer')
    const timerLabelEl = document.getElementById('timer-label')
    const timerClockEl = document.getElementById('timer-clock')
    const iconLayer   = document.getElementById('icon-layer')
    let timerInterval = null

    // Mirror of src/icons.tsx's ICONS — kept in sync by hand since live.html
    // is a static file with no bundler/import access. If you add or change
    // an icon there, update its `svg` entry here too.
    const ICON_DEFS = {
      cross:    '<line x1="12" y1="2" x2="12" y2="22"/><line x1="5" y1="8" x2="19" y2="8"/>',
      heart:    '<path d="M12 20 C12 20 3 13.5 3 8.5 C3 5.5 5.5 3 8.5 3 C10.2 3 11.4 3.9 12 5 C12.6 3.9 13.8 3 15.5 3 C18.5 3 21 5.5 21 8.5 C21 13.5 12 20 12 20 Z"/>',
      star:     '<polygon points="12,2 14.9,9.1 22,9.6 16.5,14.3 18.2,21.3 12,17.3 5.8,21.3 7.5,14.3 2,9.6 9.1,9.1"/>',
      dove:     '<path d="M3 15 C7 10 10 9 13 9 C13 9 12 7 14 5 C14 8 16 8 17 7 C16.5 9 15 10 13 10.5 C16 11 19 12 21 10 C19 15 14 17 9 16.5 C6.5 16.5 4.5 16 3 15 Z"/>',
      book:     '<path d="M12 6 C10 4.5 6.5 4 4 4.5 L4 18 C6.5 17.5 10 18 12 19.5 C14 18 17.5 17.5 20 18 L20 4.5 C17.5 4 14 4.5 12 6 Z"/><line x1="12" y1="6" x2="12" y2="19.5"/>',
      music:    '<circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/><path d="M9 18 V4 L19 2 V16"/>',
      flame:    '<path d="M12 2 C9 6 7 9 7 12.5 C7 16 9.5 18 12 18 C14.5 18 17 16 17 12.5 C17 11 16.3 9.5 15.3 8.5 C15.3 10 14.3 11 13.3 10.7 C13.9 8.5 12.8 5.5 12 2 Z"/>',
      sun:      '<circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/>',
      bell:     '<path d="M12 3 C9.5 3 8 5 8 8 C8 12 6.5 13 6 14.5 H18 C17.5 13 16 12 16 8 C16 5 14.5 3 12 3 Z"/><path d="M10 17 C10 18.5 10.9 19.5 12 19.5 C13.1 19.5 14 18.5 14 17"/>',
      mic:      '<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11 C5 15 8 18 12 18 C16 18 19 15 19 11"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/>',
      gift:     '<rect x="3" y="9" width="18" height="12" rx="1"/><line x1="3" y1="14" x2="21" y2="14"/><line x1="12" y1="9" x2="12" y2="21"/><path d="M12 9 C12 9 9 9 8 6.5 C7.3 4.8 8.7 3 10.3 3.5 C11.8 4 12 6.5 12 9 Z"/><path d="M12 9 C12 9 15 9 16 6.5 C16.7 4.8 15.3 3 13.7 3.5 C12.2 4 12 6.5 12 9 Z"/>',
      globe:    '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/>',
      quote:    '<path d="M7 8 C5 8 4 9.5 4 11.5 C4 13.5 5.5 15 7.5 15 L6.5 20"/><path d="M16 8 C14 8 13 9.5 13 11.5 C13 13.5 14.5 15 16.5 15 L15.5 20"/>',
    }

    function renderIcon(iconId, color, size, pos) {
      const def = iconId && ICON_DEFS[iconId]
      if (!def) { iconLayer.style.display = 'none'; return }
      iconLayer.style.display = 'block'
      iconLayer.style.opacity = pos === 'behind' ? '0.16' : '1'
      iconLayer.innerHTML = '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size +
        '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + def + '</svg>'
      const pad = 48
      iconLayer.style.top = iconLayer.style.bottom = iconLayer.style.left = iconLayer.style.right = 'auto'
      iconLayer.style.transform = 'none'
      switch (pos) {
        case 'top-left':      iconLayer.style.top = pad + 'px'; iconLayer.style.left = pad + 'px'; break
        case 'top-right':     iconLayer.style.top = pad + 'px'; iconLayer.style.right = pad + 'px'; break
        case 'bottom-left':   iconLayer.style.bottom = pad + 'px'; iconLayer.style.left = pad + 'px'; break
        case 'bottom-right':  iconLayer.style.bottom = pad + 'px'; iconLayer.style.right = pad + 'px'; break
        case 'bottom-center': iconLayer.style.bottom = pad + 'px'; iconLayer.style.left = '50%'; iconLayer.style.transform = 'translateX(-50%)'; break
        case 'behind':        iconLayer.style.top = '50%'; iconLayer.style.left = '50%'; iconLayer.style.transform = 'translate(-50%,-50%)'; break
        case 'top-center':
        default:              iconLayer.style.top = pad + 'px'; iconLayer.style.left = '50%'; iconLayer.style.transform = 'translateX(-50%)'; break
      }
    }

    // Same scheme as preload.ts's mediaUrl() / main.ts's protocol.handle('shogun-media', ...).
    // Kept local to this file since live.html has no bundler/import access.
    function mediaUrl(filePath) {
      return 'shogun-media://local/' + encodeURIComponent(filePath)
    }

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null }
    }

    function formatCountdown(ms) {
      const totalSeconds = Math.max(0, Math.round(ms / 1000))
      const h = Math.floor(totalSeconds / 3600)
      const m = Math.floor((totalSeconds % 3600) / 60)
      const s = totalSeconds % 60
      const pad = n => String(n).padStart(2, '0')
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`
    }

    function startTimer(data) {
      stopTimer()
      timerLabelEl.textContent = data.label || ''
      const tick = () => {
        const remaining = data.targetTime - Date.now()
        timerClockEl.textContent = formatCountdown(remaining)
        timerClockEl.classList.toggle('done', remaining <= 0)
        if (remaining <= 0) stopTimer()
      }
      tick()
      timerInterval = setInterval(tick, 250)
    }

    function hideAll() {
      textLayer.classList.remove('visible')
      videoLayer.classList.remove('visible')
      imageLayer.classList.remove('visible')
      blankLayer.classList.remove('visible')
      timerLayer.classList.remove('visible')
      iconLayer.style.display = 'none'
      stopTimer()
    }

    function update(data) {
      if (!data) return
      const type = data.type || 'text'

      if (type === 'blank') {
        hideAll()
        blankLayer.classList.add('visible')
        return
      }

      if (type === 'clear') {
        hideAll()
        videoEl.pause()
        videoEl.src = ''
        return
      }

      if (type === 'video') {
        hideAll()
        if (data.filePath) {
          videoEl.src = mediaUrl(data.filePath)
          videoEl.loop   = !!data.loop
          videoEl.muted  = !!data.muted
          videoEl.play().catch(() => {})
          videoLayer.classList.add('visible')
        }
        return
      }

      if (type === 'image') {
        hideAll()
        videoEl.pause()
        if (data.filePath) {
          imageLayer.style.backgroundImage = `url("${mediaUrl(data.filePath)}")`
          imageLayer.style.backgroundSize = data.fitMode === 'fill' ? 'cover' : 'contain'
          imageLayer.classList.add('visible')
        }
        return
      }

      if (type === 'timer') {
        hideAll()
        videoEl.pause()
        if (data.targetTime) {
          startTimer(data)
          timerLayer.classList.add('visible')
        }
        return
      }

      // Default: text / scripture / announcement / slide
      videoEl.pause()
      hideAll()

      // Sunlight Mode: force max-contrast rendering — no software can add
      // brightness a projector doesn't have, but pure black/white, a heavier
      // weight, a thin matching text-stroke (crisper glyph edges), and a
      // larger minimum size are the levers that actually help against glare.
      // A background image only gives ambient light more detail to wash out,
      // so it's dropped entirely while this is on.
      const hv = !!data.highVisibility
      const hvBg   = data.highVisibilityInvert ? '#000000' : '#ffffff'
      const hvFont = data.highVisibilityInvert ? '#ffffff' : '#000000'

      bgLayer.style.background = hv ? hvBg : (data.bgColor || '#000000')
      if (!hv && data.bgImage) {
        bgLayer.style.backgroundImage = `url(${data.bgImage})`
        bgLayer.style.backgroundSize  = 'cover'
        bgLayer.style.backgroundPosition = 'center'
      } else {
        bgLayer.style.backgroundImage = 'none'
      }

      const baseFontSize = data.fontSize || 52
      lyricsEl.style.fontSize   = (hv ? Math.max(baseFontSize, 64) : baseFontSize) + 'px'
      lyricsEl.style.textAlign  = data.textAlign  || 'center'
      lyricsEl.style.fontFamily = data.fontFamily || "Georgia, 'Times New Roman', serif"
      lyricsEl.style.color      = hv ? hvFont : (data.fontColor  || '#ffffff')
      lyricsEl.style.fontWeight = hv ? '900' : '300'
      lyricsEl.style.webkitTextStroke = hv ? `0.4px ${hvFont}` : ''
      titleEl.style.color = hv ? (data.highVisibilityInvert ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.55)') : 'rgba(255,255,255,0.5)'
      if (data.textAlign === 'left')  textLayer.style.alignItems = 'flex-start'
      else if (data.textAlign === 'right') textLayer.style.alignItems = 'flex-end'
      else textLayer.style.alignItems = 'center'

      const borderWidth = data.borderWidth || 0
      if (borderWidth > 0) {
        textBox.style.border = borderWidth + 'px ' + (data.borderStyle || 'solid') + ' ' + (data.borderColor || '#ffffff')
        textBox.style.borderRadius = (data.borderRadius || 0) + 'px'
        textBox.style.padding = '28px 44px'
      } else {
        textBox.style.border = '0px solid transparent'
        textBox.style.borderRadius = '0px'
        textBox.style.padding = '0'
      }

      // Icons are a design accent, not something Sunlight Mode's max-contrast
      // rendering should preserve — same reasoning as dropping the bg image.
      if (hv) renderIcon(null)
      else renderIcon(data.icon, data.iconColor || '#ffffff', data.iconSize || 64, data.iconPos || 'top-center')

      setTimeout(() => {
        titleEl.textContent  = data.title  || ''
        lyricsEl.textContent = data.lyrics || ''
        titleEl.style.display = data.title ? 'block' : 'none'
        textLayer.classList.add('visible')
      }, 120)
    }

    // Register IPC listener — must happen after contextBridge is ready.
    // contextBridge is synchronously available before any script runs in
    // Electron with preload, but we guard with a short retry just in case.
    function registerLiveListener() {
      if (window.shogunos && typeof window.shogunos.onUpdateLive === 'function') {
        window.shogunos.onUpdateLive(update)
        return true
      }
      return false
    }

    if (!registerLiveListener()) {
      // Retry a few times if the bridge wasn't ready immediately
      let attempts = 0
      const retry = setInterval(() => {
        if (registerLiveListener() || ++attempts > 20) clearInterval(retry)
      }, 50)
    }

    // Escape closes the live output. This window can end up as the only
    // thing with OS focus (borderless, always-on-top on multi-display
    // setups) — without this, the only way back to the app was killing the
    // process, since the operator's keyboard shortcuts live in the main
    // window and never reach this one.
    // Lets the main process advance a running folder loop when a video
    // finishes on its own — a no-op when no loop is active. Only fires for
    // non-looping videos: a manually-looped single video never "ends".
    videoEl.addEventListener('ended', () => {
      if (!videoEl.loop && window.shogunos && typeof window.shogunos.notifyVideoEnded === 'function') {
        window.shogunos.notifyVideoEnded()
      }
    })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.shogunos && typeof window.shogunos.closeLive === 'function') {
        window.shogunos.closeLive()
      }
    })
  </script>
</body>
</html>
