<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ShogunOS — Live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #bg-layer {
      position: fixed; inset: 0;
      background: #000;
      background-size: cover;
      background-position: center;
      transition: background-color 0.4s ease;
    }
    #bg-overlay { position: fixed; inset: 0; background: transparent; }

    #text-layer {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #text-layer.visible { opacity: 1; transform: translateY(0); }

    #title-el {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 18px; font-weight: 400;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    #lyrics-el {
      font-size: 52px; line-height: 1.65;
      font-weight: 300; letter-spacing: 0.03em;
      color: #fff; text-align: center;
      white-space: pre-line; word-break: break-word;
    }

    #text-box {
      max-width: 100%;
      border: 0px solid transparent;
      border-radius: 0px;
      padding: 0;
      box-sizing: border-box;
      transition: border-color 0.3s ease, border-width 0.3s ease, border-radius 0.3s ease;
    }

    #video-layer {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #video-layer.visible { opacity: 1; }
    #video-el {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    #image-layer {
      position: fixed; inset: 0;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #image-layer.visible { opacity: 1; }

    #blank-layer {
      position: fixed; inset: 0;
      background: #000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #blank-layer.visible { opacity: 1; }

    #timer-layer {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #timer-layer.visible { opacity: 1; pointer-events: auto }
    #timer-label {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 22px; font-weight: 400;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 28px;
      text-align: center;
    }
    #timer-clock {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 168px; font-weight: 200;
      color: #fff; letter-spacing: 0.04em;
      line-height: 1;
    }
    #timer-clock.done { color: #c23b3b; }
  </style>
</head>
<body>
  <div id="bg-layer"></div>
  <div id="bg-overlay"></div>

  <div id="image-layer"></div>

  <div id="video-layer">
    <video id="video-el" playsinline></video>
  </div>

  <div id="text-layer">
    <div id="text-box">
      <div id="title-el"></div>
      <div id="lyrics-el"></div>
    </div>
  </div>

  <div id="blank-layer"></div>

  <div id="timer-layer">
    <div id="timer-label"></div>
    <div id="timer-clock">00:00</div>
  </div>

  <script>
    const bgLayer    = document.getElementById('bg-layer')
    const textLayer  = document.getElementById('text-layer')
    const textBox    = document.getElementById('text-box')
    const titleEl    = document.getElementById('title-el')
    const lyricsEl   = document.getElementById('lyrics-el')
    const videoLayer = document.getElementById('video-layer')
    const videoEl    = document.getElementById('video-el')
    const imageLayer = document.getElementById('image-layer')
    const blankLayer = document.getElementById('blank-layer')
    const timerLayer = document.getElementById('timer-layer')
    const timerLabelEl = document.getElementById('timer-label')
    const timerClockEl = document.getElementById('timer-clock')
    let timerInterval = null

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null }
    }

    function formatCountdown(ms) {
      const totalSeconds = Math.max(0, Math.round(ms / 1000))
      const h = Math.floor(totalSeconds / 3600)
      const m = Math.floor((totalSeconds % 3600) / 60)
      const s = totalSeconds % 60
      const pad = n => String(n).padStart(2, '0')
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`
    }

    function startTimer(data) {
      stopTimer()
      timerLabelEl.textContent = data.label || ''
      const tick = () => {
        const remaining = data.targetTime - Date.now()
        timerClockEl.textContent = formatCountdown(remaining)
        timerClockEl.classList.toggle('done', remaining <= 0)
        if (remaining <= 0) stopTimer()
      }
      tick()
      timerInterval = setInterval(tick, 250)
    }

    function hideAll() {
      textLayer.classList.remove('visible')
      videoLayer.classList.remove('visible')
      imageLayer.classList.remove('visible')
      blankLayer.classList.remove('visible')
      timerLayer.classList.remove('visible')
      stopTimer()
    }

    function update(data) {
      if (!data) return
      const type = data.type || 'text'

      if (type === 'blank') {
        hideAll()
        blankLayer.classList.add('visible')
        return
      }

      if (type === 'clear') {
        hideAll()
        videoEl.pause()
        videoEl.src = ''
        return
      }

      if (type === 'video') {
        hideAll()
        if (data.filePath) {
          videoEl.src = 'file://' + data.filePath
          videoEl.loop   = !!data.loop
          videoEl.muted  = !!data.muted
          videoEl.play().catch(() => {})
          videoLayer.classList.add('visible')
        }
        return
      }

      if (type === 'image') {
        hideAll()
        videoEl.pause()
        if (data.filePath) {
          imageLayer.style.backgroundImage = `url("file://${data.filePath.replace(/\\/g, '/')}")`
          imageLayer.style.backgroundSize = data.fitMode === 'fill' ? 'cover' : 'contain'
          imageLayer.classList.add('visible')
        }
        return
      }

      if (type === 'timer') {
        hideAll()
        videoEl.pause()
        if (data.targetTime) {
          startTimer(data)
          timerLayer.classList.add('visible')
        }
        return
      }

      // Default: text / scripture / announcement / slide
      videoEl.pause()
      hideAll()

      bgLayer.style.background = data.bgColor || '#000000'
      if (data.bgImage) {
        bgLayer.style.backgroundImage = `url(${data.bgImage})`
        bgLayer.style.backgroundSize  = 'cover'
        bgLayer.style.backgroundPosition = 'center'
      } else {
        bgLayer.style.backgroundImage = 'none'
      }

      lyricsEl.style.fontSize   = (data.fontSize || 52) + 'px'
      lyricsEl.style.textAlign  = data.textAlign  || 'center'
      lyricsEl.style.fontFamily = data.fontFamily || "Georgia, 'Times New Roman', serif"
      lyricsEl.style.color      = data.fontColor  || '#ffffff'
      if (data.textAlign === 'left')  textLayer.style.alignItems = 'flex-start'
      else if (data.textAlign === 'right') textLayer.style.alignItems = 'flex-end'
      else textLayer.style.alignItems = 'center'

      const borderWidth = data.borderWidth || 0
      if (borderWidth > 0) {
        textBox.style.border = borderWidth + 'px ' + (data.borderStyle || 'solid') + ' ' + (data.borderColor || '#ffffff')
        textBox.style.borderRadius = (data.borderRadius || 0) + 'px'
        textBox.style.padding = '28px 44px'
      } else {
        textBox.style.border = '0px solid transparent'
        textBox.style.borderRadius = '0px'
        textBox.style.padding = '0'
      }

      setTimeout(() => {
        titleEl.textContent  = data.title  || ''
        lyricsEl.textContent = data.lyrics || ''
        titleEl.style.display = data.title ? 'block' : 'none'
        textLayer.classList.add('visible')
      }, 120)
    }

    // Register IPC listener — must happen after contextBridge is ready.
    // contextBridge is synchronously available before any script runs in
    // Electron with preload, but we guard with a short retry just in case.
    function registerLiveListener() {
      if (window.shogunos && typeof window.shogunos.onUpdateLive === 'function') {
        window.shogunos.onUpdateLive(update)
        return true
      }
      return false
    }

    if (!registerLiveListener()) {
      // Retry a few times if the bridge wasn't ready immediately
      let attempts = 0
      const retry = setInterval(() => {
        if (registerLiveListener() || ++attempts > 20) clearInterval(retry)
      }, 50)
    }

    // Escape closes the live output. This window can end up as the only
    // thing with OS focus (borderless, always-on-top on multi-display
    // setups) — without this, the only way back to the app was killing the
    // process, since the operator's keyboard shortcuts live in the main
    // window and never reach this one.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.shogunos && typeof window.shogunos.closeLive === 'function') {
        window.shogunos.closeLive()
      }
    })
  </script>
</body>
</html>
