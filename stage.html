<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ShogunOS Stage Monitor</title>
<style>
  :root{
    --bg0:#08070f; --bg1:#0e0c1a; --bg2:#120f20; --bg3:#1a1630;
    --b1:#2e2850; --b2:#453c74;
    --p2:#ff2d87; --p3:#ff7ab8;
    --g2:#00c2ff; --g3:#7ee8ff;
    --t1:#f2eefc; --t2:#cabfe8; --t3:#8b80b8; --t4:#5b5288;
    --live:#ff2d87; --safe:#2be08a; --warn:#ffd23f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg0);
    color:var(--t1);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;flex-direction:column;
    padding:clamp(16px,3vw,40px);
    user-select:none;
  }

  /* ── Top bar: wall clock + service elapsed timer + live/blank status ──── */
  #topbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  #clock{font-size:clamp(20px,2.4vw,34px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0.02em;color:var(--t2)}
  #elapsed{font-size:clamp(13px,1.3vw,18px);color:var(--t4);font-variant-numeric:tabular-nums;margin-top:2px}
  #status{display:flex;align-items:center;gap:10px;font-size:clamp(11px,1.1vw,14px);font-weight:700;letter-spacing:0.14em;text-transform:uppercase}
  #status-dot{width:11px;height:11px;border-radius:50%;background:var(--t4)}
  #status-dot.live{background:var(--live);box-shadow:0 0 8px var(--live),0 0 18px color-mix(in srgb, var(--live) 60%, transparent);animation:pulse 2s infinite}
  #status-dot.blank{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  @keyframes pulse{0%{box-shadow:0 0 8px var(--live),0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent)}70%{box-shadow:0 0 8px var(--live),0 0 0 14px transparent}100%{box-shadow:0 0 8px var(--live),0 0 0 0 transparent}}

  /* ── Center: current content (the bulk of the screen) ─────────────────── */
  #now{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;padding:20px 0}
  #now-eyebrow{font-size:clamp(11px,1.1vw,14px);font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--g3);margin-bottom:10px}
  #now-title{font-size:clamp(22px,3vw,40px);font-weight:700;line-height:1.25;margin-bottom:18px;max-width:92%}
  #now-content{
    font-size:clamp(24px,3.6vw,52px);font-weight:300;line-height:1.4;
    white-space:pre-line;max-width:88%;overflow:hidden;
    font-family:Georgia,'Times New Roman',serif;color:var(--t1);
  }
  #now-empty{font-size:clamp(16px,1.8vw,22px);color:var(--t4);font-weight:500}

  /* Countdown overlay — takes over the whole center area while active */
  #countdown{display:none;flex-direction:column;align-items:center;justify-content:center}
  #countdown.active{display:flex}
  #countdown-label{font-size:clamp(14px,1.6vw,20px);font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--t3);margin-bottom:16px}
  #countdown-clock{font-size:clamp(48px,9vw,140px);font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:0.02em;color:var(--p3);text-shadow:0 0 30px color-mix(in srgb, var(--p2) 45%, transparent)}
  #countdown-clock.done{color:var(--live)}

  /* ── Bottom: what's next ───────────────────────────────────────────────── */
  #next{
    flex-shrink:0;display:flex;align-items:center;gap:16px;
    border-top:1px solid var(--b1);padding-top:clamp(14px,2vh,24px);
  }
  #next-badge{font-size:clamp(10px,1vw,12px);font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--g3);
    background:color-mix(in srgb, var(--g2) 18%, transparent);border:1px solid color-mix(in srgb, var(--g2) 40%, transparent);
    padding:5px 12px;border-radius:20px;flex-shrink:0}
  #next-title{font-size:clamp(16px,1.8vw,24px);font-weight:600;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #next-empty{font-size:clamp(14px,1.5vw,18px);color:var(--t4);font-style:italic}
</style>
</head>
<body>
  <div id="topbar">
    <div>
      <div id="clock">--:--:--</div>
      <div id="elapsed">Monitor started 0:00 ago</div>
    </div>
    <div id="status"><div id="status-dot"></div><span id="status-text">Off Air</span></div>
  </div>

  <div id="now">
    <div id="countdown">
      <div id="countdown-label"></div>
      <div id="countdown-clock">00:00</div>
    </div>
    <div id="now-body">
      <div id="now-eyebrow" style="display:none">Now Showing</div>
      <div id="now-title" style="display:none"></div>
      <div id="now-content"></div>
      <div id="now-empty">Nothing live</div>
    </div>
  </div>

  <div id="next">
    <div id="next-badge" style="display:none"></div>
    <div id="next-title" style="display:none"></div>
    <div id="next-empty">Nothing queued</div>
  </div>

  <script>
    const clockEl        = document.getElementById('clock')
    const elapsedEl      = document.getElementById('elapsed')
    const statusDotEl    = document.getElementById('status-dot')
    const statusTextEl   = document.getElementById('status-text')
    const nowBodyEl      = document.getElementById('now-body')
    const nowEyebrowEl   = document.getElementById('now-eyebrow')
    const nowTitleEl     = document.getElementById('now-title')
    const nowContentEl   = document.getElementById('now-content')
    const nowEmptyEl     = document.getElementById('now-empty')
    const countdownEl    = document.getElementById('countdown')
    const countdownLabelEl = document.getElementById('countdown-label')
    const countdownClockEl = document.getElementById('countdown-clock')
    const nextBadgeEl    = document.getElementById('next-badge')
    const nextTitleEl    = document.getElementById('next-title')
    const nextEmptyEl    = document.getElementById('next-empty')

    const openedAt = Date.now()
    let countdownInterval = null

    function pad(n){ return String(n).padStart(2,'0') }

    function tickClock(){
      const now = new Date()
      clockEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds())
      const elapsedMs = Date.now() - openedAt
      const totalSec = Math.floor(elapsedMs/1000)
      const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60
      elapsedEl.textContent = 'Monitor started ' + (h>0?h+':':'') + pad(m) + ':' + pad(s) + ' ago'
    }
    tickClock()
    setInterval(tickClock, 1000)

    function stopCountdown(){
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null }
      countdownEl.classList.remove('active')
      nowBodyEl.style.display = ''
    }

    function startCountdown(timer){
      stopCountdown()
      countdownEl.classList.add('active')
      nowBodyEl.style.display = 'none'
      countdownLabelEl.textContent = timer.label || 'Starting Soon'
      const tick = () => {
        const remaining = timer.targetTime - Date.now()
        const totalSec = Math.max(0, Math.round(remaining/1000))
        const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60
        countdownClockEl.textContent = (h>0?h+':':'') + pad(m) + ':' + pad(s)
        countdownClockEl.classList.toggle('done', remaining <= 0)
      }
      tick()
      countdownInterval = setInterval(tick, 250)
    }

    function update(data){
      if (!data) return

      // Status dot: live / blank / off-air
      statusDotEl.className = data.live ? (data.blankScreen ? 'blank' : 'live') : ''
      statusTextEl.textContent = data.live ? (data.blankScreen ? 'Blanked' : 'On Air') : 'Off Air'

      // Countdown takes over the center area whenever one's running.
      if (data.timer && data.timer.targetTime) {
        startCountdown(data.timer)
      } else {
        stopCountdown()
      }

      // Now showing
      if (data.live && !data.blankScreen) {
        nowEmptyEl.style.display = 'none'
        nowEyebrowEl.style.display = ''
        nowTitleEl.style.display = ''
        nowTitleEl.textContent = data.live
        nowContentEl.textContent = data.content || ''
        nowEyebrowEl.textContent = data.currentLabel || 'Now Showing'
      } else {
        nowEyebrowEl.style.display = 'none'
        nowTitleEl.style.display = 'none'
        nowContentEl.textContent = ''
        nowEmptyEl.style.display = ''
        nowEmptyEl.textContent = data.blankScreen ? 'Screen blanked' : 'Nothing live'
      }

      // Up next
      if (data.nextTitle) {
        nextEmptyEl.style.display = 'none'
        nextBadgeEl.style.display = ''
        nextTitleEl.style.display = ''
        nextBadgeEl.textContent = data.nextType || 'Next'
        nextTitleEl.textContent = data.nextTitle
      } else {
        nextBadgeEl.style.display = 'none'
        nextTitleEl.style.display = 'none'
        nextEmptyEl.style.display = ''
      }
    }

    function registerStageListener(){
      if (window.shogunos && typeof window.shogunos.onUpdateStage === 'function') {
        window.shogunos.onUpdateStage(update)
        return true
      }
      return false
    }
    if (!registerStageListener()) {
      let attempts = 0
      const retry = setInterval(() => {
        if (registerStageListener() || ++attempts > 20) clearInterval(retry)
      }, 50)
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.shogunos && typeof window.shogunos.closeStageMonitor === 'function') {
        window.shogunos.closeStageMonitor()
      }
    })
  </script>
</body>
</html>
